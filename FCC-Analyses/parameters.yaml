selection:
  # Option 1: use a Python selection function
  script:
    file_name: event_selection.py
    function: select_pt

  # Option 2: use an inline C++ filter expression
  # filter: "ROOT::VecOps::Any(ROOT::VecOps::sqrt(Jet.momentum.x*Jet.momentum.x + Jet.momentum.y*Jet.momentum.y) > 90)"

additional_fields: 
  - file_name: new_collections.py
    function: particle_collections

  - file_name: new_collections.py
    function: missing_energy

  - file_name: new_collections.py
    function: event_information

variables:
  Jet:
    - px: "Jet.momentum.x"
    - py: "Jet.momentum.y"
    - pz: "Jet.momentum.z"
    - pt: "ROOT::VecOps::sqrt(Jet.momentum.x*Jet.momentum.x + Jet.momentum.y*Jet.momentum.y)"
    - p: "ROOT::VecOps::sqrt(Jet.momentum.x*Jet.momentum.x + Jet.momentum.y*Jet.momentum.y + Jet.momentum.z*Jet.momentum.z)"
    - theta: "ROOT::VecOps::atan2(ROOT::VecOps::sqrt(Jet.momentum.x*Jet.momentum.x + Jet.momentum.y*Jet.momentum.y), Jet.momentum.z)"
    - phi: "ROOT::VecOps::atan2(Jet.momentum.y, Jet.momentum.x)"
    - energy: "Jet.energy"
    - mass
    - charge

  Muon:
    - px
    - py
    - pz
    - pt
    - p
    - theta
    - phi
    - energy
    - charge
    - isolation
    - d0
    - z0
    - d0Error
    - z0Error

  Electron:
    - px
    - py
    - pz
    - pt
    - p
    - theta
    - phi
    - energy
    - charge
    - d0
    - z0
    - d0Error
    - z0Error

  Photon:
    - px
    - py
    - pz
    - pt
    - p
    - theta
    - phi
    - energy
    - charge

  MissingEnergy:
    - px
    - py
    - pz
    - energy

  EventInfo:
    - event
    - run
    - weight
    - nTrack