selection: null

additional_fields:
  - file_name: new_collections.py
    function: particle_collections

  - file_name: new_collections.py
    function: particle_track_information

  - file_name: new_collections.py
    function: muon_isolation

  - file_name: new_collections.py
    function: missing_energy

  - file_name: new_collections.py
    function: event_information

variables:
  Jet:
    - px
    - py
    - pz
    - pt: "np.sqrt(px*px + py*py)"
    - p: "np.sqrt(px*px + py*py + pz*pz)"
    - theta: "np.arctan2(np.sqrt(px*px + py*py), pz)"
    - phi: "np.arctan2(py, px)"
    - energy
    - charge

  Muon:
    - px
    - py
    - pz
    - pt: "np.sqrt(px*px + py*py)"
    - p: "np.sqrt(px*px + py*py + pz*pz)"
    - theta: "np.arctan2(np.sqrt(px*px + py*py), pz)"
    - phi: "np.arctan2(py, px)"
    - energy
    - charge
    - goodnessOfPID
    - d0
    - z0
    - d0Error
    - z0Error
    - isolation

  Electron:
    - px
    - py
    - pz
    - pt: "np.sqrt(px*px + py*py)"
    - p: "np.sqrt(px*px + py*py + pz*pz)"
    - theta: "np.arctan2(np.sqrt(px*px + py*py), pz)"
    - phi: "np.arctan2(py, px)"
    - energy
    - charge
    - goodnessOfPID
    - d0
    - z0
    - d0Error
    - z0Error

  Photon:
    - px
    - py
    - pz
    - pt: "np.sqrt(px*px + py*py)"
    - p: "np.sqrt(px*px + py*py + pz*pz)"
    - theta: "np.arctan2(np.sqrt(px*px + py*py), pz)"
    - phi: "np.arctan2(py, px)"
    - energy
    - charge

  MissingEnergy:
    - px
    - py
    - pz
    - pt: "np.sqrt(px*px + py*py)"

  EventInfo:
    - event
    - run
    - weight
    - nTrack
